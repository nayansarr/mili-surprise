    <meta charset="UTF-8" />
    <script>
      (function() {
        // Provide writable getter/setter for window.fetch to prevent extension interceptor errors
        try {
          var _origFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _origFetch;
            },
            set: function(val) {
              _origFetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {}

        try {
          var _origXHR = window.XMLHttpRequest;
          Object.defineProperty(window, 'XMLHttpRequest', {
            get: function() {
              return _origXHR;
            },
            set: function(val) {
              _origXHR = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {}

        // Guard against uncaught third-party extension injection exceptions
        window.addEventListener('error', function(event) {
          if (
            (event.filename && event.filename.indexOf('chrome-extension://') !== -1) ||
            (event.message && event.message.indexOf('Cannot set property fetch') !== -1)
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
